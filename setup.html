<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка игры</title>
    <link rel="stylesheet" href="setup.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="setup-container">
        <h1>Настройка игры</h1>
        
        <div class="setup-section">
            <h2>Создание комнаты</h2>
            <p>Создайте комнату и поделитесь ссылкой с другим игроком</p>
            <button id="createRoom" class="btn-start">Создать комнату</button>
        </div>
        
        <div id="joinSection" class="setup-section" style="display: none;">
            <h2>Или присоединиться</h2>
            <input type="text" id="roomCodeInput" placeholder="Код комнаты" maxlength="6">
            <button id="joinRoom" class="btn-start">Присоединиться</button>
        </div>
    </div>
    
    <script src="setup.js"></script>
</body>
</html>

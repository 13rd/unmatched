<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровое поле</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Игровое поле</h1>
        
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        
        <div class="controls">
            <button id="clearBoard">Очистить поле</button>
            <button id="backToSetup">Вернуться к настройкам</button>
        </div>
    </div>
    
    <div class="container2">
        <div class="hp-panel">
            <h2>Счётчики HP</h2>
            
            <div class="player-hp-section">
                <h3>Игрок 1</h3>
                <div id="player1-chips" class="chips-list"></div>
            </div>
            
            <div class="player-hp-section">
                <h3>Игрок 2</h3>
                <div id="player2-chips" class="chips-list"></div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
